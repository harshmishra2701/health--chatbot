[tool.poetry]
package-mode = false

[project]
name = "health-chat-bot"
version = "0.1"
description = "health chat bot for the user to conselt with ai"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "motor (>=3.7.1,<4.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "path (>=17.1.1,<18.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "google-genai (>=2.8.0,<3.0.0)",
    "pymongo (>=4.17.0,<5.0.0)"
]

[tool.poetry.scripts]
health-chatbot = "app.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"